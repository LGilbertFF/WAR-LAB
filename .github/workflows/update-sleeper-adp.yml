name: Update Sleeper ADP Lab Data

on:
  workflow_dispatch:
  schedule:
    - cron: "42 8 * * *"

permissions:
  contents: write

jobs:
  update-sleeper-adp:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ADP dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch current Sleeper drafts
        run: >
          python scripts/sleeper_ingest_current.py
          --season 2026
          --out-dir sleeper_work
          --expansion-steps 2
          --max-users-per-step 2500
          --max-leagues 60000
          --workers 24

      - name: Export ADP Lab data
        run: >
          python scripts/export_sleeper_adp_board.py
          --season 2026
          --raw-dir sleeper_work/raw
          --players sleeper_work/cache/players_nfl.parquet
          --out data/custom_adp_board.csv

      - name: Commit updated Sleeper ADP data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update Sleeper ADP data"
          file_pattern: data/custom_adp_board.csv
