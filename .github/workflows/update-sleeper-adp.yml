name: Update Sleeper Dynasty ADP Lab Data

on:
  workflow_dispatch:
    inputs:
      rebuild_existing:
        description: "Ignore seen draft cache and replace the current dynasty shard"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    - cron: "42 8 * * *"

permissions:
  contents: write

jobs:
  update-sleeper-dynasty-adp:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ADP dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch current dynasty Sleeper drafts
        run: >
          python scripts/sleeper_ingest_current.py
          --season 2026
          --out-dir sleeper_dynasty_work
          --league-format dynasty
          --seen-leagues data/sleeper_seen_dynasty_leagues.csv
          --expansion-steps 10
          --max-users-per-step 0
          --max-leagues 0
          --max-drafts 0
          --seen-mode "${{ inputs.rebuild_existing == 'true' && 'ignore' || 'skip' }}"
          --workers 16

      - name: Export ADP Lab data
        shell: bash
        run: |
          args=(
            --season 2026
            --raw-dir sleeper_dynasty_work/raw
            --players sleeper_dynasty_work/cache/players_nfl.parquet
            --out data/custom_adp_board.csv
            --append-existing
            --max-output-mb 90
            --shard-dir data/adp
            --shard-manifest data/adp/manifest.json
            --skip-csv
          )
          if [ "${{ inputs.rebuild_existing }}" != "true" ]; then
            args+=(--merge-existing)
          fi
          python scripts/export_sleeper_adp_board.py "${args[@]}"

      - name: Commit updated Sleeper dynasty ADP data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update Sleeper dynasty ADP data"
          file_pattern: data/adp/*.json.gz data/adp/manifest.json data/sleeper_seen_dynasty_leagues.csv
