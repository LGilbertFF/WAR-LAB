name: Backfill Historical Sleeper Redraft ADP

on:
  workflow_dispatch:
    inputs:
      start_season:
        description: "First Sleeper season to backfill"
        required: true
        default: "2018"
      end_season:
        description: "Last Sleeper season to backfill"
        required: true
        default: "2025"
      expansion_steps:
        description: "League discovery expansion steps"
        required: true
        default: "4"
      max_leagues_per_season:
        description: "Maximum redraft leagues to discover per season"
        required: true
        default: "500000"
      max_drafts_per_season:
        description: "Maximum eligible completed redraft drafts to fetch picks for per season"
        required: true
        default: "750000"
      draft_start_date:
        description: "Optional draft date window start, YYYY-MM-DD. Blank uses Jan 1 of each season."
        required: false
        default: ""
      draft_end_date:
        description: "Optional draft date window end, YYYY-MM-DD. Blank uses Dec 31 of each season."
        required: false
        default: ""
      max_output_rows:
        description: "Fair cap for committed ADP CSV rows; 0 means no cap"
        required: true
        default: "0"
      max_output_mb:
        description: "Hard safety cap for committed ADP CSV size in MB"
        required: true
        default: "90"

permissions:
  contents: write

jobs:
  backfill-sleeper-redraft-adp:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ADP dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch historical redraft Sleeper drafts
        run: >
          python scripts/sleeper_ingest_historical.py
          --start-season "${{ inputs.start_season }}"
          --end-season "${{ inputs.end_season }}"
          --out-dir sleeper_redraft_work
          --expansion-steps "${{ inputs.expansion_steps }}"
          --max-users-per-step 2500
          --max-leagues-per-season "${{ inputs.max_leagues_per_season }}"
          --max-drafts-per-season "${{ inputs.max_drafts_per_season }}"
          --league-format redraft
          --draft-start-date "${{ inputs.draft_start_date }}"
          --draft-end-date "${{ inputs.draft_end_date }}"
          --seen-leagues-dir data/historical_seen_leagues
          --workers 16

      - name: Export historical redraft ADP Lab data
        run: >
          python scripts/export_sleeper_adp_board.py
          --start-season "${{ inputs.start_season }}"
          --end-season "${{ inputs.end_season }}"
          --raw-dir sleeper_redraft_work/raw
          --players sleeper_redraft_work/cache/players_nfl.parquet
          --out data/custom_adp_board.csv
          --append-existing
          --merge-existing
          --max-output-rows "${{ inputs.max_output_rows }}"
          --max-output-mb "${{ inputs.max_output_mb }}"
          --shard-dir data/adp
          --shard-manifest data/adp/manifest.json
          --skip-csv

      - name: Commit historical redraft Sleeper ADP data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Backfill historical Sleeper redraft ADP data"
          file_pattern: data/adp/*.json.gz data/adp/manifest.json data/historical_seen_leagues/*.csv
