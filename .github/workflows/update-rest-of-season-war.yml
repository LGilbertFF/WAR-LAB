name: Update Rest of Season WAR

on:
  schedule:
    - cron: "30 10 * * 2"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-rest-of-season-war
  cancel-in-progress: false

jobs:
  update-ros-war:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      PYTHONUNBUFFERED: "1"
      FANTASYPOINTS_STORAGE_STATE_B64: ${{ secrets.FANTASYPOINTS_STORAGE_STATE_B64 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install scraper dependencies
        run: |
          pip install -r scripts/requirements.txt
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Verify authenticated browser state exists
        run: |
          if [ -z "$FANTASYPOINTS_STORAGE_STATE_B64" ]; then
            echo "Missing repository secret FANTASYPOINTS_STORAGE_STATE_B64"
            exit 1
          fi

      - name: Scrape rest-of-season rankings and export WAR data
        run: |
          python scripts/fantasypoints_authenticated_ros_rankings.py \
            --season-year 2026 \
            --login-wait-seconds 60

      - name: Validate generated rest-of-season data
        run: |
          python - <<'PY'
          import gzip
          import json
          from pathlib import Path

          import pandas as pd

          csv_path = Path("data/current_ros_rankings.csv")
          json_path = Path("data/war/current_ros_rankings.json.gz")
          if not csv_path.exists() or not json_path.exists():
              raise SystemExit("ROS scraper did not create both required output files")
          rows = pd.read_csv(csv_path)
          if len(rows) < 150:
              raise SystemExit(f"ROS output has only {len(rows)} rows; refusing to publish")
          with gzip.open(json_path, "rt", encoding="utf-8") as handle:
              browser_rows = json.load(handle)
          if len(browser_rows) != len(rows):
              raise SystemExit(f"CSV/JSON row mismatch: {len(rows)} vs {len(browser_rows)}")
          print(f"Validated {len(rows)} ROS rankings")
          PY

      - name: Commit updated rest-of-season data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            data/current_ros_rankings.csv \
            data/war/current_ros_rankings.json.gz \
            data/war/manifest.json \
            data/scrape_manifest.json
          if git diff --cached --quiet; then
            echo "ROS data is unchanged; nothing to commit"
          else
            git commit -m "Update rest-of-season WAR rankings"
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload refreshed site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy refreshed site
        id: deployment
        uses: actions/deploy-pages@v4
