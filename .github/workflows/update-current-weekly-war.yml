name: Update Current Weekly WAR Stats

on:
  workflow_dispatch:
    inputs:
      season_year:
        description: "NFL season year"
        required: true
        default: "2026"
      week_last:
        description: "Most recent completed week. Leave blank to use the saved week."
        required: false
        default: ""
  schedule:
    # Run at 6:00 AM America/New_York across both EDT and EST.
    - cron: "0 10,11 * * 2"

permissions:
  contents: write

concurrency:
  group: update-current-weekly-war
  cancel-in-progress: false

jobs:
  schedule-check:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.local-time.outputs.run }}
    steps:
      - id: local-time
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(TZ=America/New_York date +%H)" = "06" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  update-current-weekly-war:
    needs: schedule-check
    if: needs.schedule-check.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scraper dependencies
        run: pip install -r scripts/requirements.txt

      - name: Resolve saved current week
        id: current-week
        shell: bash
        run: |
          args=(--season-year "${{ github.event.inputs.season_year || '2026' }}")
          if [ "${{ github.event_name }}" = "schedule" ]; then
            args+=(--advance)
          elif [ -n "${{ github.event.inputs.week_last }}" ]; then
            args+=(--set-week "${{ github.event.inputs.week_last }}")
          fi
          python scripts/current_week_state.py "${args[@]}"

      - name: Scrape current weekly stats
        run: python scripts/fantasypros_scraper.py --current-weekly --season-year "${{ github.event.inputs.season_year || '2026' }}" --week-last "${{ steps.current-week.outputs.week_last }}"

      - name: Validate weekly stats independently of ROS rankings
        env:
          EXPECTED_SEASON: ${{ github.event.inputs.season_year || '2026' }}
          EXPECTED_WEEK: ${{ steps.current-week.outputs.week_last }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          import pandas as pd

          path = Path("data/current_weekly_stats.csv")
          if not path.exists():
              raise SystemExit("Weekly stats scrape did not create data/current_weekly_stats.csv")
          rows = pd.read_csv(path, low_memory=False)
          required = {"Year", "Week", "Pos"}
          missing_columns = required - set(rows.columns)
          if missing_columns:
              raise SystemExit(f"Weekly stats are missing columns: {sorted(missing_columns)}")
          season = int(os.environ["EXPECTED_SEASON"])
          week = int(os.environ["EXPECTED_WEEK"])
          year_values = pd.to_numeric(rows["Year"], errors="coerce")
          week_values = pd.to_numeric(rows["Week"], errors="coerce")
          current = rows[(year_values == season) & (week_values == week)]
          positions = set(current.get("Pos", pd.Series(dtype=str)).astype(str).str.upper())
          missing = {"QB", "RB", "WR", "TE"} - positions
          if current.empty or missing:
              raise SystemExit(
                  f"Weekly stats are incomplete for {season} Week {week}; "
                  f"rows={len(current)}, missing positions={sorted(missing)}"
              )
          print(f"Validated {len(current):,} weekly stat rows for {season} Week {week}")
          PY

      - name: Refresh current player teams and headshots
        run: python scripts/fetch_espn_headshots.py

      - name: Export browser-ready weekly stats
        run: python scripts/export_war_data.py --current

      - name: Commit updated weekly stats
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update current weekly WAR stats"
          file_pattern: assets/player-headshots/*.jpg data/current_week.json data/current_weekly_stats.csv data/player_headshots.json data/war/current_weekly_stats.json.gz data/war/manifest.json data/scrape_manifest.json
